# Casa Presente: câmera, microfone e alto-falante da cozinha.
# Só este notebook e o servidor do painel (192.168.1.1) podem publicar e ouvir o microfone; a rede local só vê a câmera.
authInternalUsers:
  - user: any
    ips: [127.0.0.1, ::1, 192.168.1.1]
    permissions:
      - action: publish
      - action: read
      - action: playback
      - action: api
  - user: any
    permissions:
      - action: read
        path: cam
      - action: read
        path: cam-lite

# WebRTC só oferece os endereços da rede local e do Tailscale (sem docker0 e afins).
# Troque wlan0 pelo nome da sua interface (ip -br addr).
webrtcIPsFromInterfacesList: [wlan0, tailscale0]

paths:
  # Logitech C922 em 1080p30: MJPEG decodificado e H.264 codificado na GPU Intel (VAAPI), ≈10% de um núcleo.
  # Caminhos por ID/PCI não mudam com a ordem dos dispositivos. Outra webcam: veja `ls /dev/v4l/by-id/`
  # e `v4l2-ctl -d <dispositivo> --list-formats-ext`; sem VAAPI, use o bloco x264 do README.
  cam:
    runOnInit: >
      env LIBVA_DRIVER_NAME=i965
      ffmpeg -nostdin -hide_banner -loglevel warning
      -hwaccel vaapi -hwaccel_device /dev/dri/by-path/pci-0000:00:02.0-render -hwaccel_output_format vaapi
      -f v4l2 -input_format mjpeg -video_size 1920x1080 -framerate 30
      -i /dev/v4l/by-id/usb-046d_C922_Pro_Stream_Webcam_C52DC7BF-video-index0
      -an -vf scale_vaapi=format=nv12 -c:v h264_vaapi -b:v 6M -maxrate 6M -g 60 -bf 0
      -f rtsp -rtsp_transport tcp rtsp://127.0.0.1:$RTSP_PORT/$MTX_PATH
    runOnInitRestart: yes

  # Vídeo leve para o celular (≈450 kbps, 640 px, 15 qps): o "cam" tem ≈6 Mbps.
  # Só codifica enquanto alguém assiste; decodifica, reduz e codifica na GPU Intel (≈10% de um núcleo).
  cam-lite:
    runOnDemand: >
      env LIBVA_DRIVER_NAME=i965
      ffmpeg -nostdin -hide_banner -loglevel warning
      -hwaccel vaapi -hwaccel_device /dev/dri/by-path/pci-0000:00:02.0-render -hwaccel_output_format vaapi
      -rtsp_transport tcp -i rtsp://127.0.0.1:$RTSP_PORT/cam
      -an -vf fps=15,scale_vaapi=w=640:h=360:format=nv12
      -c:v h264_vaapi -profile:v constrained_baseline -b:v 450k -maxrate 450k -g 30 -bf 0
      -f rtsp -rtsp_transport tcp rtsp://127.0.0.1:$RTSP_PORT/$MTX_PATH
    runOnDemandRestart: yes
    runOnDemandCloseAfter: 10s

  # Microfone com eco cancelado; só captura enquanto alguém está ouvindo.
  mic:
    runOnDemand: >
      ffmpeg -hide_banner -loglevel warning
      -f pulse -fragment_size 1920 -i cozinha-microfone
      -ac 1 -c:a libopus -b:a 48k -application voip -frame_duration 20
      -f rtsp -rtsp_transport tcp rtsp://127.0.0.1:$RTSP_PORT/$MTX_PATH
    runOnDemandRestart: yes
    runOnDemandCloseAfter: 5s

  # Voz de quem chama, publicada pelo painel; toca no alto-falante com eco cancelado.
  talk:
    runOnAvailable: >
      ffmpeg -hide_banner -loglevel warning
      -fflags nobuffer -flags low_delay -rtsp_transport tcp
      -i rtsp://127.0.0.1:$RTSP_PORT/$MTX_PATH
      -vn -ac 1 -f pulse -buffer_duration 60 -device cozinha-falante Chamada
    runOnAvailableRestart: yes

  # Rosto de quem atendeu a chamada do botão: o painel publica (WHIP) e a tela do quiosque no notebook lê (WHEP).
  face: {}
