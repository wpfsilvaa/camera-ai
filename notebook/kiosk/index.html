<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="google" content="notranslate">
  <title>Casa Presente</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/kiosk.css">
  <script src="/kiosk.js" defer></script>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <main id="screen" data-view="idle">
    <header>
      <div><time id="clock">--:--</time><span id="date"></span></div>
      <div class="status"><span id="vigia" class="vigia hidden" role="status"><svg class="vi vi-shield" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5 4.5 5.5v6c0 4.6 3.1 8.4 7.5 10 4.4-1.6 7.5-5.4 7.5-10v-6L12 2.5Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="m8.7 12.2 2.4 2.4 4.3-4.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><svg class="vi vi-eye hidden" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg><span id="vigia-text"></span></span><span id="battery" class="hidden"></span></div>
    </header>

    <section id="view-idle" class="view">
      <p id="greeting" class="greeting hidden" role="status"></p>
      <p id="greeting-sub" class="greeting-sub hidden"></p>
      <div id="confetti" class="confetti hidden" aria-hidden="true"></div>
      <section id="reminders" class="reminders hidden" aria-live="polite"><div class="rem-label">Lembrete</div><p id="rem-text"></p><small id="rem-meta"></small><div id="rem-dots" class="rem-dots"></div></section>
      <div class="idle-row">
        <div class="actions">
          <button id="btn-call" class="big call" type="button"><span class="icon" aria-hidden="true">📞</span>Chamar a família</button>
          <button id="btn-panic" class="big panic" type="button"><span class="icon" aria-hidden="true">🆘</span>Preciso de ajuda</button>
          <p id="note" class="note hidden"></p>
        </div>
        <aside id="calendar" class="calendar" aria-label="Calendário"></aside>
      </div>
    </section>

    <section id="view-confirm" class="view">
      <h1>Pedir ajuda agora?</h1>
      <p>A família será avisada na hora.</p>
      <button id="confirm-yes" class="big panic" type="button">Sim, pedir ajuda</button>
      <button id="confirm-no" class="big neutral" type="button">Não, voltar</button>
    </section>

    <section id="view-ringing" class="view">
      <div class="pulse" aria-hidden="true">📞</div>
      <h1 id="ringing-title">Chamando a família…</h1>
      <p>Aguarde, alguém já vai atender.</p>
      <button id="btn-cancel" class="big neutral" type="button">Cancelar</button>
    </section>

    <section id="view-answered" class="view">
      <div class="face-box">
        <video id="face" autoplay muted playsinline class="hidden"></video>
        <div id="avatar" class="avatar" aria-hidden="true"></div>
      </div>
      <h1 id="answered-title"></h1>
      <p>Pode falar, a pessoa está ouvindo.</p>
      <button id="btn-end" class="big neutral" type="button">Encerrar</button>
    </section>

    <section id="view-over" class="view">
      <h1 id="over-title"></h1>
      <p id="over-text"></p>
    </section>
  </main>
</body>
</html>
