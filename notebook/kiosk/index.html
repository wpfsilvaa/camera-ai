<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="google" content="notranslate">
  <title>Casa Presente</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/kiosk.css">
  <script src="/kiosk.js" defer></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs><symbol id="ic-phone" viewBox="0 0 24 24"><path d="M5 4h3.5l1.8 4.5-2.3 1.5a11 11 0 0 0 6 6l1.5-2.3L20 15.5V19a1.5 1.5 0 0 1-1.5 1.5A15.5 15.5 0 0 1 3.5 5.5 1.5 1.5 0 0 1 5 4z"/></symbol><symbol id="ic-battery" viewBox="0 0 24 24"><rect x="3" y="7.5" width="16" height="9" rx="2"/><path d="M21.5 10.5v3M6.5 10.5v3"/></symbol><symbol id="ic-bolt" viewBox="0 0 24 24"><path d="M13 2.5 5 13.5h6l-1 8 8-11h-6z" fill="currentColor"/></symbol></defs></svg>
  <div id="frame" class="frame hidden" aria-live="polite">
    <div class="slide" id="slide-a"><div class="back"></div><img alt=""></div>
    <div class="slide" id="slide-b"><div class="back"></div><img alt=""></div>
    <div class="scrim top"></div><div class="scrim bottom"></div>
    <div class="fr-head">
      <div class="fr-time" id="frame-clock">--:--</div>
      <div class="fr-date" id="frame-date"></div>
      <div class="fr-today" id="frame-today"></div>
    </div>
    <div class="fr-status" id="frame-status"></div>
    <div class="fr-weather hidden" id="frame-weather" aria-label="Previsão do tempo"></div>
    <div class="frame-greet-box"><p id="frame-greeting" class="frame-greeting hidden"></p><p id="frame-greeting-sub" class="frame-greeting-sub hidden"></p></div>
    <section id="frame-reminder" class="frame-reminder hidden"><div class="rem-label">Lembrete</div><p id="fr-text"></p><small id="fr-meta"></small></section>
    <div class="fr-foot">
      <div class="fr-cal" id="frame-cal" aria-label="Calendário do mês"></div>
      <p id="frame-hint" class="frame-hint"></p>
    </div>
    <p id="frame-credit" class="fr-credit"></p>
    <div class="fr-progress"><i id="frame-progress"></i></div>
  </div>
  <canvas id="rain" class="rain hidden" aria-hidden="true"></canvas>
  <div id="quote" class="quote hidden" aria-live="polite"><div id="quote-head" class="quote-head hidden"></div><figure><blockquote id="quote-text"></blockquote><figcaption id="quote-by"></figcaption></figure><button id="quote-ok" type="button" class="quote-ok hidden">Li ✓</button><div id="quote-timer" class="quote-timer hidden"><span>Visualização única · some em 30 segundos</span><b><i></i></b></div></div>
  <div id="nightlight" class="nightlight hidden" aria-hidden="true"><time id="nightlight-clock">--:--</time></div>
  <div class="glow" aria-hidden="true"></div>
  <main id="screen" data-view="idle" data-mode="ui">
    <header>
      <div><time id="clock">--:--</time><span id="date"></span></div>
      <div class="status"><span id="ui-weather" class="weather-chip hidden"></span><span id="vigia" class="vigia hidden" role="status"><svg class="vi vi-shield" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5 4.5 5.5v6c0 4.6 3.1 8.4 7.5 10 4.4-1.6 7.5-5.4 7.5-10v-6L12 2.5Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="m8.7 12.2 2.4 2.4 4.3-4.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><svg class="vi vi-eye hidden" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg><span id="vigia-text"></span></span><span id="battery" class="hidden"></span></div>
    </header>

    <section id="view-idle" class="view">
      <p id="greeting" class="greeting hidden" role="status"></p>
      <p id="greeting-sub" class="greeting-sub hidden"></p>
      <div id="confetti" class="confetti hidden" aria-hidden="true"></div>
      <section id="reminders" class="reminders hidden" aria-live="polite"><div class="rem-label">Lembrete</div><p id="rem-text"></p><small id="rem-meta"></small><div id="rem-dots" class="rem-dots"></div></section>
      <div class="idle-row">
        <div class="actions">
          <button id="btn-call" class="big call" type="button"><span class="icon" aria-hidden="true"><svg class="ic" aria-hidden="true"><use href="#ic-phone"/></svg></span>Chamar a família</button>
          <div id="callto" class="callto hidden" aria-label="Chamar uma pessoa"></div>
          <button id="btn-panic" class="big panic" type="button"><span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="1em" height="1em"><circle cx="12" cy="12" r="10.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 6.5v7" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><circle cx="12" cy="17.2" r="1.6" fill="currentColor"/></svg></span>Preciso de ajuda</button>
          <p id="note" class="note hidden"></p>
        </div>
        <aside id="calendar" class="calendar" aria-label="Calendário"></aside>
      </div>
    </section>

    <section id="view-confirm" class="view">
      <h1>Pedir ajuda agora?</h1>
      <p>A família será avisada na hora.</p>
      <button id="confirm-yes" class="big panic" type="button">Sim, pedir ajuda</button>
      <button id="confirm-no" class="big neutral" type="button">Não, voltar</button>
    </section>

    <section id="view-ringing" class="view">
      <div class="pulse" aria-hidden="true"><svg class="ic" aria-hidden="true"><use href="#ic-phone"/></svg></div>
      <h1 id="ringing-title">Chamando a família…</h1>
      <p>Aguarde, alguém já vai atender.</p>
      <button id="btn-cancel" class="big neutral" type="button">Cancelar</button>
    </section>

    <section id="view-answered" class="view">
      <div class="face-box">
        <video id="face" autoplay muted playsinline class="hidden"></video>
        <div id="avatar" class="avatar" aria-hidden="true"></div>
      </div>
      <h1 id="answered-title"></h1>
      <p>Pode falar, a pessoa está ouvindo.</p>
      <button id="btn-end" class="big neutral" type="button">Encerrar</button>
    </section>

    <section id="view-over" class="view">
      <h1 id="over-title"></h1>
      <p id="over-text"></p>
    </section>
  </main>
</body>
</html>
