# Cancelamento de eco para a chamada da cozinha (Casa Presente).
# A voz que sai em "cozinha-falante" é removida do que entra em "cozinha-microfone".
context.modules = [
  { name = libpipewire-module-echo-cancel
    args = {
      library.name = aec/libspa-aec-webrtc
      aec.args = {
        webrtc.gain_control = true
        webrtc.noise_suppression = true
        webrtc.high_pass_filter = true
      }
      audio.rate = 48000
      audio.channels = 1
      audio.position = [ MONO ]
      capture.props = { node.passive = true }
      source.props = { node.name = "cozinha-microfone" node.description = "Cozinha: microfone (sem eco)" }
      sink.props = { node.name = "cozinha-falante" node.description = "Cozinha: alto-falante (chamada)" }
      playback.props = { node.passive = true }
    }
  }
]
